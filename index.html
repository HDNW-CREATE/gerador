<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Tags de Natal com Nome</title>
<style>
:root{--red:#B71C2B;--green:#1F5C3A;--cream:#FFF7EA;--ink:#2A2421}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--cream)}
header{background:var(--red);color:#fff;padding:22px 28px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.9}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:24px 28px;align-items:start}
.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:16px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
textarea,input,select{width:100%;padding:10px;border:1px solid #d9d2c8;border-radius:10px;font:inherit}
textarea{height:220px;resize:vertical}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{border:2px solid transparent;border-radius:12px;background:#f6f1ea;padding:6px;cursor:pointer}
.themes button.on{border-color:var(--green);background:#e8f3ec}.themes img{width:100%;display:block}
.go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.hint{font-size:12px;color:#7a716b;margin-top:8px}
.sheet{background:#fff;width:210mm;min-height:297mm;padding:10mm 15mm;margin:0 auto 16px;display:grid;grid-template-columns:90mm 90mm;grid-auto-rows:38mm;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tag{border:1px dashed #bdb5ac;padding:3mm;width:90mm;height:38mm}
.tag .in{height:100%;border-radius:4mm;padding:2mm;display:flex;align-items:center;gap:3mm}
.tag .card{background:#fff;border-radius:3mm;height:100%;width:100%;display:flex;align-items:center;gap:3mm;padding:2mm 3mm}
.tag img{width:24mm;height:24mm;object-fit:contain;flex:none}
.tag .t1{font-weight:800;font-size:13pt;line-height:1.1}.tag .nm{font-weight:700;font-size:15pt;line-height:1.15;margin-top:1mm;word-break:break-word}
.tag .t2{font-size:8.5pt;margin-top:1mm;color:#5d5550}
@media print{header,.panel,.hint{display:none}body{background:#fff}.wrap{display:block;padding:0}.sheet{box-shadow:none;margin:0;page-break-after:always}
@page{size:A4;margin:0}}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.panel{position:static}.sheet{transform:scale(.45);transform-origin:top left}}
</style></head><body>
<header><h1>Gerador de Tags de Natal com Nome</h1><p>Cole a lista de nomes, escolha o tema e clique em Imprimir. Tudo funciona no seu computador, sem internet.</p></header>
<div class="wrap">
<div class="panel">
<label>1. Nomes (um por linha)</label>
<textarea id="names">Ana Clara
Bernardo
Cecília
Davi Lucas
Eduarda
Francisco</textarea>
<label>2. Tema</label><div class="themes" id="themes"></div>
<label>3. Mensagem de cima</label><input id="msg" value="Feliz Natal!">
<label>4. Assinatura (opcional)</label><input id="from" value="Com carinho, Tia ___">
<button class="go" onclick="window.print()">Imprimir as tags</button>
<p class="hint">Na impressão, escolha papel A4, escala 100% e margens "Nenhuma". 12 tags por folha.</p>
</div>
<div id="out"></div>
</div>

for (const k in THEMES){const b=document.createElement('button');b.innerHTML='<img src="'+THEMES[k].img+'" alt="'+THEMES[k].label+'" title="'+THEMES[k].label+'">';
b.onclick=()=>{cur=k;render()};b.dataset.k=k;th.appendChild(b)}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 [...th.children].forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
 const names=document.getElementById('names').value.split('\n').map(s=>s.trim()).filter(Boolean);
 const msg=esc(document.getElementById('msg').value), fr=esc(document.getElementById('from').value), t=THEMES[cur];
 const out=document.getElementById('out'); out.innerHTML='';
 for(let i=0;i<Math.max(names.length,1);i+=12){
  const sh=document.createElement('div');sh.className='sheet';
  names.slice(i,i+12).forEach(n=>{sh.insertAdjacentHTML('beforeend',
   '<div class="tag"><div class="in" style="background:'+t.bg+'"><div class="card"><img src="'+t.img+'"><div><div class="t1" style="color:'+t.bg+'">'+msg+'</div><div class="nm">'+esc(n)+'</div><div class="t2">'+fr+'</div></div></div></div></div>')});
  out.appendChild(sh);
 }
}
['names','msg','from'].forEach(id=>document.getElementById(id).addEventListener('input',render));
render();
</script></body></html>
